# vim: set ft=gitconfig:
# Windows only. Deploys to ~/.config/git/platform.conf, which config includes.
# Overrides the identity and core flags that config sets for Linux/WSL.
[user]
	name = {{to_lower_case (env_var "USERNAME")}}
	email = {{to_lower_case (env_var "USERNAME")}}@{{replace (to_lower_case (env_var "USERDNSDOMAIN")) "corp." ""}}

[core]
	ignorecase = false
	editor = nvim
	symlinks = false

[includeIf "gitdir/i:{{env_var "USERPROFILE"}}/scoop/"]
	path = ~/.config/git/github.conf

{{#if git.enterprise.dirs_windows}}
{{#each git.enterprise.dirs_windows}}
[includeIf "gitdir/i:{{this}}"]
	path = ~/.config/git/enterprise.conf

{{/each}}
{{/if}}
