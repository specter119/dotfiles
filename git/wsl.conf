# vim: set ft=gitconfig:
# WSL only. Deploys to ~/.config/git/platform.conf, which config includes.
# Reuses the Windows scoop install for credentials and the GitHub identity.
[includeIf "gitdir:{{env_var "WSL_WIN_HOME"}}/scoop/"]
	path = ~/.config/git/github.conf

{{#if git.enterprise.dirs_wsl}}
{{#each git.enterprise.dirs_wsl}}
[includeIf "gitdir:{{this}}"]
	path = ~/.config/git/enterprise.conf

{{/each}}
{{/if}}
[credential]
	helper = {{env_var "WSL_WIN_HOME"}}/scoop/apps/mingit/current/ucrt64/bin/git-credential-manager.exe
