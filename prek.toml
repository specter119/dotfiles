# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  {id = "check-added-large-files"},
  {id = "check-case-conflict"},
  {id = "check-symlinks"},
  {id = "check-toml", exclude = '^(alacritty/alacritty\.toml|bun/bunfig\.toml|codex/codex/config\.toml|jj/config\.toml|magpie/plugins/bunfig\.toml|uv/uv\.toml|voxtype/voxtype/config\.toml|yazi/yazi\.toml)$'},
  {id = "check-yaml", exclude = '^(glab/config\.yml|mihomo/config\.yaml|skm/skills\.yaml)$'},
  {id = "check-json", exclude = '^(amp/settings\.json|antigravity/antigravity/(mcp_config|settings)\.json|copilot/mcp-config\.json|enterprise-artifact/\.docker/config\.json|droid/config/(mcp|settings)\.json|magpie/settings\.json|opencode/(config/tui|share/auth)\.json|pi/(auth|models|settings)\.json)$'},
  {id = "detect-private-key"},
  {id = "end-of-file-fixer", exclude = '^fcitx5/fcitx5'},
  {id = "forbid-new-submodules"},
  {id = "mixed-line-ending"},
  {id = "trailing-whitespace"},
  {id = "pretty-format-json", args = ["--autofix"], exclude = '^(enterprise-artifact/\.docker/config\.json|amp/settings\.json|antigravity/antigravity/(mcp_config|settings)\.json|copilot/mcp-config\.json|droid/config/(mcp|settings)\.json|magpie/settings\.json|opencode/(config/tui|share/auth)\.json|pi/(auth|models|settings)\.json)$'},
]

[[repos]]
repo = "https://github.com/pappasam/toml-sort"
rev = "v0.25.0"
hooks = [
  {id = "toml-sort-fix", args = ["--in-place", "--no-sort-tables"], exclude = '^(\.dotter/global\.toml|alacritty/alacritty\.toml|bun/bunfig\.toml|codex/codex/config\.toml|jj/config\.toml|magpie/plugins/bunfig\.toml|prek\.toml|uv/uv\.toml|voxtype/voxtype/config\.toml|yazi/yazi\.toml)$'}
]
