GALLIUM_DRIVER=d3d12
LIBVA_DRIVER_NAME=d3d12
# Host-driver workaround: mesa d3d12 defaults to the integrated adapter, whose Windows
# driver fails allocations under WSL. Falls back to the default if no NVIDIA adapter matches.
MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA

# WSLg serves both Wayland (its weston) and X11 (Xwayland on :0), but
# systemd --user does not inherit the DISPLAY that WSLg hands to interactive
# sessions. Pin the user manager to Xwayland and keep GTK on the X11 backend:
# without this, GTK silently falls back to the default Wayland socket and the
# D-Bus activated portal dialogs end up on Wayland while the applications that
# request them (Electron/Xwayland) stay on X11. Such a dialog cannot be made
# transient for an X11 parent window -- "Failed to associate portal window with
# parent window x11:0x..." -- and the pending file chooser freezes the caller.
GDK_BACKEND=x11
DISPLAY=:0
