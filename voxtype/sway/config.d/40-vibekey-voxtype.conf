# Ulanzi Vibekey (USB fff1:00dd, reports itself as AU05).
# Factory keymap: K1 = Super+H, K2 = Return, K3 = Escape, big key = BackSpace,
# knob = scroll wheel. Only K1 is rebound, and only for this device, so the
# real keyboard keeps Super+H.
set $vibekey 65521:221:AU05_AU05_Keyboard
set $voxtype ~/.nix-profile/bin/voxtype

# Hold K1 to talk. The device releases Super before H, so the release event
# arrives as a bare `h`; bind both forms so recording always stops.
bindsym --input-device=$vibekey --no-repeat Super+h exec $voxtype record start
bindsym --input-device=$vibekey --release Super+h exec $voxtype record stop
bindsym --input-device=$vibekey --release h exec $voxtype record stop
