######### 锚点 start #######
# 策略组相关
pr: &pr {type: select, proxies: [默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择, 直连]}
# 地区组直接负责在本地区节点中做延迟优选
rt: &rt {type: url-test, include-all-providers: true, url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 5000, lazy: true, max-failed-times: 3, tolerance: 50, expected-status: 204}
# GenAI Oversea 不使用大陆、香港或台湾；直连作为可选回退
genai: &genai {type: select, proxies: [日本, 新加坡, 美国, 其它地区, 直连]}
#这里是订阅更新和延迟测试相关的
p: &p {type: http, interval: 3600, health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 300}}
######### 锚点 end #######

# url 里填写自己的订阅,名称不能重复
proxy-providers:
  Doggygo:
    !!merge <<: *p
    url: "{{replace (command_output 'rbw get doggygo_subscription_url') '\n' ''}}"
  BoostNet:
    !!merge <<: *p
    url: "{{replace (command_output 'rbw get boostnet2_subscription_url') '\n' ''}}"
ipv6: true
allow-lan: true
mixed-port: 7890
unified-delay: false
tcp-concurrent: true
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - Mijia Cloud
tun:
  enable: true
  # stack: mixed
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
dns:
  enable: true
  listen: :1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - "*"
    - +.lan
    - +.local
    # {{#each mihomo.direct_suffixes}}
    - +.{{this}}
    # {{/each}}
    - +.tailscale.com
    - +.tailscale.io
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
  nameserver-policy:
    rule-set:cn_domain,private:
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    rule-set:geolocation-!cn:
      - https://dns.cloudflare.com/dns-query#dns
      - https://dns.google/dns-query#dns
proxies:
  - name: 直连
    type: direct
    udp: true
proxy-groups:
  - {name: 默认, type: select, proxies: [自动选择, 直连, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点]}
  - {name: dns, type: select, proxies: [自动选择, 默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点]}
  - {name: Google, !!merge <<: *pr}
  - {name: Github, !!merge <<: *pr}
  - {name: GenAI Oversea, !!merge <<: *genai}
  - {name: YouTube, !!merge <<: *pr}
  - {name: 国内, type: select, proxies: [直连, 默认, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点, 自动选择]}
  - {name: 其他, !!merge <<: *pr}
  #分隔,下面是地区分组
  - {name: 香港, !!merge <<: *rt, filter: "(?i)港|hk|hongkong|hong kong"}
  - {name: 台湾, !!merge <<: *rt, filter: "(?i)台|tw|taiwan"}
  - {name: 日本, !!merge <<: *rt, filter: "(?i)日|jp|japan"}
  - {name: 美国, !!merge <<: *rt, filter: "(?i)美|us|unitedstates|united states"}
  - {name: 新加坡, !!merge <<: *rt, filter: "(?i)(新|sg|singapore)"}
  - {name: 其它地区, !!merge <<: *rt, filter: "(?i)^(?!.*(?:🇭🇰|🇯🇵|🇺🇸|🇸🇬|🇨🇳|港|hk|hongkong|台|tw|taiwan|日|jp|japan|新|sg|singapore|美|us|unitedstates)).*", exclude-filter: "剩余流量|距离下次重置|套餐到期|永久官网"}
  - {name: 全部节点, type: select, include-all-providers: true, exclude-filter: "剩余流量|距离下次重置|套餐到期|永久官网"}
  - {name: 自动选择, !!merge <<: *rt, exclude-filter: "剩余流量|距离下次重置|套餐到期|永久官网"}
rules:
  - GEOIP,lan,直连,no-resolve
  # {{#each mihomo.direct_suffixes}}
  - DOMAIN-SUFFIX,{{this}},直连,no-resolve
  # {{/each}}
  - DOMAIN-SUFFIX,tailscale.com,直连,no-resolve
  - DOMAIN-SUFFIX,tailscale.io,直连,no-resolve
  - RULE-SET,github_domain,Github
  - RULE-SET,openai_domain,GenAI Oversea
  - RULE-SET,gemini_domain,GenAI Oversea
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,cn_domain,国内
  - DOMAIN-SUFFIX,pandora.com,美国
  - RULE-SET,geolocation-!cn,其他
  - RULE-SET,google_ip,Google
  - RULE-SET,cn_ip,国内
  - MATCH,其他
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: yaml}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: yaml}
rule-providers:
  private:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.yaml
  cn_domain:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.yaml
  github_domain:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.yaml
  openai_domain:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/openai.yaml
  gemini_domain:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/google-gemini.yaml
  youtube_domain:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.yaml
  google_domain:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.yaml
  geolocation-!cn:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.yaml
  cn_ip:
    !!merge <<: *ip
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.yaml
  google_ip:
    !!merge <<: *ip
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.yaml
