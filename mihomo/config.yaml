######### 锚点 start #######
# 地区组为手动选择：节点费率差异大，选定后不随延迟测试自动切换；
# 每个地区组内置“<地区>自动”（url-test）作为默认项，想自动优选时选它，选了具体节点则固定不变；
# 自动组只是被地区组引用的内部组，设 hidden 避免在面板里作为独立分组出现
rg: &rg {type: select, include-all-providers: true}
# 地区节点过滤正则，地区组与对应的“<地区>自动”组共用
f_hk: &f_hk "(?i)香港|🇭🇰|(?<![a-z])hk(?![a-z])|hong ?kong"
f_tw: &f_tw "(?i)台湾|台灣|台北|🇹🇼|(?<![a-z])tw(?![a-z])|taiwan"
f_jp: &f_jp "(?i)日本|东京|大阪|🇯🇵|(?<![a-z])jp(?![a-z])|japan"
f_us: &f_us "(?i)美国|美國|🇺🇸|(?<![a-z])(?:us|usa)(?![a-z])|united ?states"
f_sg: &f_sg "(?i)新加坡|🇸🇬|(?<![a-z])sg(?![a-z])|singapore"
f_other: &f_other "(?i)^(?!.*(?:香港|🇭🇰|(?<![a-z])hk(?![a-z])|hong ?kong|台湾|台灣|台北|🇹🇼|(?<![a-z])tw(?![a-z])|taiwan|日本|东京|大阪|🇯🇵|(?<![a-z])jp(?![a-z])|japan|美国|美國|🇺🇸|(?<![a-z])(?:us|usa)(?![a-z])|united ?states|新加坡|🇸🇬|(?<![a-z])sg(?![a-z])|singapore|🇨🇳)).*"
junk: &junk "剩余流量|距离下次重置|套餐到期|永久官网"
rt: &rt {type: url-test, include-all-providers: true, url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 5000, lazy: true, max-failed-times: 3, tolerance: 50, expected-status: 204}
# 订阅更新和延迟测试
p: &p {type: http, interval: 3600, health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 300}}
######### 锚点 end #######

# 订阅列表见 mihomo.subscriptions：每项 name 必填，url 或 rbw（Bitwarden 条目名）二选一
proxy-providers:
  # {{#each mihomo.subscriptions}}
  "{{name}}":
    !!merge <<: *p
    url: "{{#if url}}{{url}}{{else}}{{replace (command_output (replace "rbw get '__ITEM__'" "__ITEM__" rbw)) '\n' ''}}{{/if}}"
  # {{/each}}
ipv6: true
allow-lan: true
mixed-port: 7890
unified-delay: false
tcp-concurrent: true
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - Mijia Cloud
tun:
  enable: true
  # stack: mixed
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
# fake-ip 模式下境外域名由代理节点解析，本地只解析直连域名，所以只配国内 DoH，不需要走代理的 dns 组
dns:
  enable: true
  listen: :1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - "*"
    - +.lan
    - +.local
    # {{#each mihomo.direct_suffixes}}
    - +.{{this}}
    # {{/each}}
    - +.tailscale.com
    - +.tailscale.io
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
proxies:
  - name: 直连
    type: direct
    udp: true
proxy-groups:
  - {name: 默认, type: select, proxies: [自动选择, 直连, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点]}
  # GenAI Oversea 不使用大陆、香港或台湾；直连作为可选回退
  - {name: GenAI Oversea, type: select, proxies: [日本, 新加坡, 美国, 其它地区, 直连]}
  - {name: Steam, type: select, proxies: [直连, 默认]}
  #分隔,下面是地区分组
  - {name: 香港, !!merge <<: *rg, proxies: [香港自动], filter: *f_hk}
  - {name: 台湾, !!merge <<: *rg, proxies: [台湾自动], filter: *f_tw}
  - {name: 日本, !!merge <<: *rg, proxies: [日本自动], filter: *f_jp}
  - {name: 美国, !!merge <<: *rg, proxies: [美国自动], filter: *f_us}
  - {name: 新加坡, !!merge <<: *rg, proxies: [新加坡自动], filter: *f_sg}
  - {name: 其它地区, !!merge <<: *rg, proxies: [其它地区自动], filter: *f_other, exclude-filter: *junk}
  - {name: 全部节点, type: select, include-all-providers: true, exclude-filter: *junk}
  - {name: 自动选择, !!merge <<: *rt, exclude-filter: *junk}
  - {name: 香港自动, !!merge <<: *rt, hidden: true, filter: *f_hk}
  - {name: 台湾自动, !!merge <<: *rt, hidden: true, filter: *f_tw}
  - {name: 日本自动, !!merge <<: *rt, hidden: true, filter: *f_jp}
  - {name: 美国自动, !!merge <<: *rt, hidden: true, filter: *f_us}
  - {name: 新加坡自动, !!merge <<: *rt, hidden: true, filter: *f_sg}
  - {name: 其它地区自动, !!merge <<: *rt, hidden: true, filter: *f_other, exclude-filter: *junk}
rules:
  - GEOIP,lan,直连,no-resolve
  # {{#each mihomo.direct_suffixes}}
  - DOMAIN-SUFFIX,{{this}},直连,no-resolve
  # {{/each}}
  - DOMAIN-SUFFIX,tailscale.com,直连,no-resolve
  - DOMAIN-SUFFIX,tailscale.io,直连,no-resolve
  - RULE-SET,openai_domain,GenAI Oversea
  - RULE-SET,gemini_domain,GenAI Oversea
  - RULE-SET,steam_cn_domain,直连
  - RULE-SET,steam_domain,Steam
  - RULE-SET,cn_domain,直连
  - DOMAIN-SUFFIX,pandora.com,美国
  - RULE-SET,geolocation-!cn,默认
  - RULE-SET,cn_ip,直连
  - MATCH,默认
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: yaml}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: yaml}
rule-providers:
  cn_domain:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.yaml
  openai_domain:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/openai.yaml
  gemini_domain:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/google-gemini.yaml
  steam_domain:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.yaml
  steam_cn_domain:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam@cn.yaml
  geolocation-!cn:
    !!merge <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.yaml
  cn_ip:
    !!merge <<: *ip
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.yaml
