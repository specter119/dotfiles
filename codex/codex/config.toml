# {{#if codex.model}}
model = "{{codex.model}}"
# {{/if}}
# {{#if codex.model_provider}}
model_provider = "{{codex.model_provider}}"
model_catalog_json = "enterprise-model-catalog.json"
# {{/if}}
personality = "pragmatic"
disable_response_storage = true
web_search = "live"
notify = ["~/.local/share/cli-hooks/notify.sh"]
model_reasoning_effort = "max"
plan_mode_reasoning_effort = "high"
suppress_unstable_features_warning = true
default_permissions = "workspace-ext"
service_tier = "default"

[model_providers]

{{#if agent.enterprise_deployments.azure}}
[model_providers.enterprise]
name = "Enterprise"
base_url = "{{agent.enterprise_deployments.azure.base_url}}"
requires_openai_auth = true
{{/if}}

[features]
collaboration_modes = true
multi_agent = true
shell_snapshot = true
hooks = true
prevent_idle_sleep = true
memories = true
terminal_resize_reflow = true
mentions_v2 = true
goals = true
browser_use = true
js_repl = false

[permissions]

[permissions.workspace-ext]
extends = ":workspace"

[permissions.workspace-ext.filesystem]
":workspace_roots" = { "." = "write", ".git" = "write" }
"~/.cache" = "write"
"/run/user/1000" = "write"

[permissions.workspace-ext.network]
enabled = true

[tui]
notifications = ["approval-requested"]
status_line = ["model-with-reasoning", "context-remaining", "current-dir"]

[tui.model_availability_nux]
"gpt-5.5" = 4

[projects]
# {{#each codex.projects}}

[projects."{{this}}"]
trust_level = "trusted"
# {{/each}}

[mcp_servers]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.context7]
command = "bunx"
args = [
  "@upstash/context7-mcp",
  "--api-key",
  "{{replace (command_output 'rbw get context7-api-key') '\n' ''}}",
]

[mcp_servers.fast-context]
command = "bunx"
args = ["fast-context-mcp"]
enabled_tools = ["fast_context_search"]

[mcp_servers.fast-context.env]
WINDSURF_API_KEY = "{{replace (command_output 'rbw get windsurf-api-key') '\n' ''}}"

[mcp_servers.fast-context.tools]

[mcp_servers.fast-context.tools.fast_context_search]
approval_mode = "approve"

[hooks]

[hooks.state]
# {{#each codex.hook_states}}

[hooks.state."{{key}}"]
trusted_hash = "{{trusted_hash}}"
# {{/each}}

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true

[notice]
hide_rate_limit_model_nudge = true
