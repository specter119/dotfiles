model_provider = "{{codex.model_provider}}"
model_catalog_json = "magpie-models.json"
personality = "pragmatic"
web_search = "live"
notify = ["~/.local/share/cli-hooks/notify.sh"]
model_reasoning_effort = "{{codex.model_reasoning_effort}}"
plan_mode_reasoning_effort = "high"
suppress_unstable_features_warning = true
default_permissions = "workspace-ext"
service_tier = "default"
# model, when magpie sets one{{#if codex.model}}
model = "{{codex.model}}"{{/if}}
openai_base_url = "http://127.0.0.1:3425/backend-api/codex"

[model_providers]
[model_providers.magpie]
name = "Magpie"
base_url = "http://127.0.0.1:3425/v1"
experimental_bearer_token = "{{agent.magpie_apikey}}"
wire_api = "responses"
supports_websockets = false

[features]
code_mode = true
multi_agent = true
shell_snapshot = true
hooks = true
prevent_idle_sleep = true
memories = true
mentions_v2 = true
goals = true
browser_use = true

[permissions]

[permissions.workspace-ext]
extends = ":workspace"

[permissions.workspace-ext.filesystem]
":workspace_roots" = { "." = "write", ".git" = "write" }
"~/.cache" = "write"
"/run/user/1000" = "write"

[permissions.workspace-ext.network]
enabled = true

[tui]
notifications = ["approval-requested"]
status_line = ["model-with-reasoning", "context-remaining", "current-dir"]

[tui.model_availability_nux]
"gpt-5.5" = 4
gpt-6-astra = 3

[projects]
# trusted project roots{{#each codex.projects}}

[projects."{{this}}"]
trust_level = "trusted"{{/each}}

[mcp_servers]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"{{#if dotter.packages.wsl-guest}}

[mcp_servers.onenote]
command = "deskhand"
args = ["onenote"]{{/if}}

[mcp_servers.magpie]
url = "http://127.0.0.1:3425/mcp/magpie/hub"
http_headers = { Authorization = "Bearer {{agent.magpie_apikey}}" }

[mcp_servers.fast-context]
command = "bunx"
args = ["fast-context-mcp"]
enabled_tools = ["fast_context_search"]

[mcp_servers.fast-context.env]
WINDSURF_API_KEY = "{{replace (command_output 'rbw get windsurf-api-key') '\n' ''}}"

[mcp_servers.fast-context.tools]

[mcp_servers.fast-context.tools.fast_context_search]
approval_mode = "approve"

[hooks]

[hooks.state]
# trusted hook hashes{{#each codex.hook_states}}

[hooks.state."{{key}}"]
trusted_hash = "{{trusted_hash}}"{{/each}}

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = true

[notice]
hide_rate_limit_model_nudge = true

[desktop]
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "persistent", "none", "minimal", "max"]
