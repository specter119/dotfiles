id = "portability-vs-live-state"
stances = ["dotfiles-portability-stance", "dotfiles-live-state-stance"]
contended_resource = "whether the repo or the live tool state is the source of truth for a rendered value"

[[opposition]]
id = "explicit-vs-friction"
stances = ["dotfiles-explicit-composition-stance", "dotfiles-low-friction-stance"]
contended_resource = "how many places a maintainer edits to add or change one deployed file"

[[opposition]]
id = "isolation-vs-sharing"
stances = ["dotfiles-enterprise-isolation-stance", "dotfiles-shared-default-stance"]
contended_resource = "how many tracked variants one logical config needs"

[[decision]]
id = "D1-reverse-sync"
kind = "sacrifice"
summary = "Reverse-sync tool-written values into local.toml instead of forcing the template over them."
owner_document = "docs/maintenance/live-state.md#when-to-reverse-sync"
reopen_when = "a tool stops rewriting its config, or a new agent config has no stable serializer"
axes = ["portability-vs-live-state"]
stances = ["dotfiles-portability-stance", "dotfiles-live-state-stance"]
surfaces = ["live-state-review"]
sacrificed = "dotfiles-portability-stance"
given_up = "the repo alone determines every rendered byte on a fresh machine"
decided_by = "user"
status = "implemented"

[[decision]]
id = "D2-serializer-fidelity"
kind = "sacrifice"
summary = "Render the tool's bytes: key order, indentation, omitempty, sorted maps; reverse-sync the values."
owner_document = "docs/maintenance/live-state.md#match-the-tools-serialization"
reopen_when = "a tool exposes a stable writer or formatter that makes both fidelity and readability achievable"
surfaces = ["config-rendering-review", "live-state-review"]
sacrificed = "U-template-readability"
given_up = "comments, grouping, and a stable key order that a maintainer would choose"
decided_by = "user"
status = "implemented"

[[decision]]
id = "D3-conditional-deploy"
kind = "joint"
summary = "Put conditional config in a <package>-<condition> source directory and gate its mapping; use #if only when the target has no drop-in."
owner_document = "docs/maintenance/config.md#conditional-configuration"
reopen_when = "a target tool stops reading the drop-in or include location"
axes = ["isolation-vs-sharing"]
stances = ["dotfiles-enterprise-isolation-stance", "dotfiles-shared-default-stance"]
surfaces = ["config-composition-review", "enterprise-boundary-review"]

[[decision]]
id = "D4-depends-restriction"
kind = "sacrifice"
summary = "Restrict depends to grouping or functional coupling; test package selection with dotter.packages.<name>."
owner_document = "docs/maintenance/config.md#package-composition"
reopen_when = "a variable-only coupling becomes necessary and the dependent has no working form without it"
axes = ["explicit-vs-friction"]
stances = ["dotfiles-explicit-composition-stance", "dotfiles-low-friction-stance"]
surfaces = ["config-composition-review"]
sacrificed = "dotfiles-low-friction-stance"
given_up = "a variable reference that pulls in a package; every new coupling is a visible edit"
decided_by = "user"
status = "implemented"

[[decision]]
id = "D5-enterprise-gating"
kind = "sacrifice"
summary = "Gate every non-default CA, TLS relaxation, and enterprise credential behind enterprise-artifact or the variable that makes it meaningful."
owner_document = "docs/maintenance/config.md#enterprise-boundary"
reopen_when = "an enterprise trust setting becomes safe to ship unconditionally"
axes = ["isolation-vs-sharing"]
stances = ["dotfiles-enterprise-isolation-stance", "dotfiles-shared-default-stance"]
surfaces = ["config-composition-review", "enterprise-boundary-review"]
sacrificed = "dotfiles-shared-default-stance"
given_up = "one unconditional base config that carries enterprise trust on every machine"
decided_by = "user"
status = "implemented"

[[decision]]
id = "D6-one-mapping-per-root"
kind = "sacrifice"
summary = "Give each target root one mapping; do not split a shared prefix into exact-file mappings."
owner_document = "docs/maintenance/config.md#files-mapping"
reopen_when = "a target root needs a different type or if condition that one mapping cannot express"
axes = ["explicit-vs-friction"]
stances = ["dotfiles-explicit-composition-stance", "dotfiles-low-friction-stance"]
surfaces = ["config-composition-review"]
sacrificed = "dotfiles-low-friction-stance"
given_up = "per-file mapping control; a new file under the root deploys without a new mapping entry"
decided_by = "user"
status = "implemented"

[[decision]]
id = "D7-package-readme"
kind = "sacrifice"
summary = "Allow a package README only for an own-target or non-deployed package; document a shared-target package in the root AGENTS.md."
owner_document = "AGENTS.md#documentation-ownership"
reopen_when = "a shared-target package gains its own target mapping or stops being deployed"
surfaces = ["doc-ownership-review"]
sacrificed = "U-doc-locality"
given_up = "a README next to the config for a package that maps into a shared target"
decided_by = "user"
status = "implemented"

[[decision]]
id = "D8-new-tool-serializer"
kind = "open"
summary = "A new agent tool rewrites its config without a stable serializer."
owner_document = "docs/maintenance/live-state.md#match-the-tools-serialization"
reopen_when = "the tool's writer is observed twice with the same bytes"
axes = ["portability-vs-live-state"]
stances = ["dotfiles-portability-stance", "dotfiles-live-state-stance"]
surfaces = ["live-state-review"]
owner = "maintainer"
next_action = "add a sync function and a fixture before enabling reverse sync"

[[unrepresented]]
id = "U-template-readability"
stake = "template readability"
where = "docs/maintenance/live-state.md#match-the-tools-serialization"
why = "no stance: every serializer conflict has been decided for fidelity; the cost is recorded as a sacrifice, not argued as a competing objective"
forge_when = "a tool exposes a stable writer or formatter that makes both achievable"

[[unrepresented]]
id = "U-unattended-deploy"
stake = "unattended deploy"
where = "docs/maintenance/deploy.md#deploy-workflow"
why = "no stance: safety gates always win; a conflict is surfaced to the user instead of auto-resolved"
forge_when = "a deploy path can prove it never overwrites a live change"

[[unrepresented]]
id = "U-doc-locality"
stake = "doc locality"
where = "AGENTS.md#documentation-ownership"
why = "no stance: a shared target must not receive a package README; the cost is paid by the maintainer who must edit the root doc"
forge_when = "a shared-target package gains its own target mapping"
