version = 2
project = "dotfiles"
reviews_dir = ".agents/reviews"
skills_dir = ".agents/skills"

[[stake]]
id = "S1"
objective = "The same tracked config renders correctly on every selected machine."
evidence = ["docs/maintenance/templates.md#override-order", "docs/maintenance/config.md#conditional-configuration"]

[[stake]]
id = "S2"
objective = "A tool's live config survives deploy and is carried back into local.toml."
evidence = ["docs/maintenance/live-state.md", ".dotter/scripts/live_config_reverse_sync.py"]

[[stake]]
id = "S3"
objective = "No secret enters the tracked tree."
evidence = ["docs/maintenance/templates.md#source-rules", ".gitignore"]

[[stake]]
id = "S4"
objective = "A template that a tool also writes renders byte-identical to the tool's serializer."
evidence = ["docs/maintenance/live-state.md#match-the-tools-serialization", "magpie/settings.json"]

[[stake]]
id = "S5"
objective = "Package selection, coupling, and mappings stay explicit and readable."
evidence = ["docs/maintenance/config.md#package-composition", "docs/maintenance/config.md#files-mapping"]

[[stake]]
id = "S6"
objective = "Graphical-session services start after the compositor environment and stop with it."
evidence = ["docs/maintenance/deploy.md#session-services", "sway/sway/config.d/50-autostart.conf"]

[[stake]]
id = "S7"
objective = "Enterprise credentials and trust settings never leak to a non-enterprise machine."
evidence = ["docs/maintenance/config.md#enterprise-boundary", "docs/maintenance/templates.md#source-rules"]

[[stake]]
id = "S8"
objective = "One fact has one owner, and a package README never lands in a shared target."
evidence = ["AGENTS.md#documentation-ownership", "git/README.md"]

[[stake]]
id = "S9"
objective = "Deploy scripts fail safe and never hide a live change behind a force deploy."
evidence = ["docs/maintenance/deploy.md#deploy-workflow", ".dotter/pre_deploy.sh"]

[[stake]]
id = "S10"
objective = "One package selection deploys a whole environment with few decisions."
evidence = ["docs/maintenance/config.md#package-composition", ".dotter/global.toml"]

[[stake]]
id = "S11"
objective = "One tracked config serves every machine class, including WSL and Windows."
evidence = ["docs/maintenance/config.md#conditional-configuration", ".dotter/wsl.toml"]

[[surface]]
id = "config-composition-review"
title = "Package composition and mapping review"
trigger = [
  "package selection, grouping, or naming",
  "depends",
  "a [pkg.files] mapping",
  "a machine include remaps a target",
  "a conditional source directory",
  "a whole-leaf #if that could be a conditional deploy or conditional context"
]
owner_documents = [
  "docs/maintenance/config.md#package-composition",
  "docs/maintenance/config.md#files-mapping",
  "docs/maintenance/config.md#conditional-configuration"
]
skill = ".agents/skills/dotfiles-config-composition-review/SKILL.md"
contends = ["explicit-vs-friction", "isolation-vs-sharing"]
paths = [".dotter/global.toml", ".dotter/wsl.toml", ".dotter/windows.toml", ".dotter/*.toml"]
exclude_paths = [".dotter/cache.toml", ".dotter/local.toml"]
keywords = ["depends", "files", "mapping", "conditional", "enterprise-artifact", "#if"]

[[surface]]
id = "config-rendering-review"
title = "Template, variable, and secret review"
trigger = [
  "a template edit",
  "a variable is declared, renamed, or removed",
  "a secret is injected or a credential is added",
  "a tool's serializer changes"
]
owner_documents = [
  "docs/maintenance/templates.md#template-rendering",
  "docs/maintenance/templates.md#variable-schema",
  "docs/maintenance/templates.md#source-rules",
  "docs/maintenance/templates.md#secret-injection",
  "docs/maintenance/templates.md#git-identities",
  "docs/maintenance/templates.md#root-and-leaf",
  "rclone/README.md#variables"
]
skill = ".agents/skills/dotfiles-config-rendering-review/SKILL.md"
unopposed_stake = "S3"
paths = [
  "**/*.toml",
  "**/*.json",
  "**/*.jsonc",
  "**/*.yml",
  "**/*.yaml",
  "**/*.conf",
  "**/*.ini",
  "**/*.fish",
  "**/*.kdl",
  "**/*.rhai",
  "**/*.netrc",
  "**/*.desktop",
  "**/*.ahk",
  "**/*.npmrc",
  "**/*.css",
  "**/*.js",
  "**/*.ts",
  "condarc/condarc",
  "go/go/env",
  "ssh/config",
  "yt-dlp/config"
]
exclude_paths = ["docs/**", ".agents/**", ".git/**", ".jj/**", "prek.toml", ".dotter/cache.toml", "**/node_modules/**"]
keywords = ["{{", "#if", "#each", "@root", "rbw", "variables", "local.toml", "command_success", "secret", "token", "password", "api_key"]

[[surface]]
id = "live-state-review"
title = "Live state and reverse-sync review"
trigger = [
  "reverse sync",
  "a tool rewrites its config",
  "a deploy conflict",
  "serialization"
]
owner_documents = [
  "docs/maintenance/live-state.md",
  "docs/maintenance/deploy.md#deploy-workflow",
  "rclone/README.md#variables"
]
skill = ".agents/skills/dotfiles-live-state-review/SKILL.md"
contends = ["portability-vs-live-state"]
unopposed_stake = "S4"
paths = [
  ".dotter/scripts/live_config_reverse_sync.py",
  ".dotter/pre_deploy.sh",
  ".dotter/wsl.toml",
  ".dotter/windows.toml",
  "pi/pi/settings.json",
  "bub/share/mcp.json",
  "droid/config/settings.json",
  "magpie/settings.json",
  "opencode/config/opencode.jsonc",
  "codex/codex/config.toml",
  "rclone/config/rclone.conf",
  "antigravity/antigravity/settings.json",
  "glab/config.yml",
  "scoop/config.json",
  "dsh/**"
]
keywords = ["reverse sync", "serialization", "local.toml", "drift", "reverse_sync", "byte-identical"]

[[surface]]
id = "enterprise-boundary-review"
title = "Enterprise trust and credential boundary review"
trigger = ["enterprise credential", "CA", "TLS", "registry", "proxy"]
owner_documents = [
  "docs/maintenance/config.md#enterprise-boundary",
  "docs/maintenance/templates.md#source-rules"
]
skill = ".agents/skills/dotfiles-enterprise-boundary-review/SKILL.md"
contends = ["isolation-vs-sharing"]
paths = ["enterprise-artifact/**", "wsl-guest-enterprise/**", "condarc-enterprise/**"]
keywords = ["enterprise", "CA", "TLS", "registry", "proxy", "netrc"]

[[surface]]
id = "deploy-operations-review"
title = "Deploy scripts, cache, and artifacts review"
trigger = ["deploy script", "deploy cache", "force deploy", "runtime artifact"]
owner_documents = ["docs/maintenance/deploy.md", "docs/maintenance/codex-worktrees.md"]
skill = ".agents/skills/dotfiles-deploy-operations-review/SKILL.md"
unopposed_stake = "S9"
paths = [".dotter/pre_deploy.sh", ".dotter/post_deploy.sh", ".dotter/helpers/**", ".dotter/cache.toml", "codex/codex/hooks.json", "codex/codex/hooks/**"]
keywords = ["deploy", "--force", "cache", "post_deploy", "runtime artifact", "pre_deploy"]

[[surface]]
id = "service-lifecycle-review"
title = "Graphical-session service lifecycle review"
trigger = ["systemd unit", "session target", "compositor autostart", "output hook"]
owner_documents = [
  "docs/maintenance/deploy.md#session-services",
  "docs/maintenance/deploy.md#session-targets",
  "docs/maintenance/deploy.md#service-defaults",
  "docs/maintenance/deploy.md#extensions"
]
skill = ".agents/skills/dotfiles-service-lifecycle-review/SKILL.md"
unopposed_stake = "S6"
paths = ["*/systemd/user/**", "sway/sway/config.d/**", "sway/sway/session-stop", "voxtype/output-hook.d/**"]
keywords = ["systemd", "graphical-session", "sway-session", "PartOf", "After", "Wants", "default.target", "sockets.target", "output-hook"]

[[surface]]
id = "doc-ownership-review"
title = "Documentation ownership review"
trigger = ["documentation edit", "README", "AGENTS.md", "review graph"]
owner_documents = ["AGENTS.md#documentation-ownership"]
skill = ".agents/skills/dotfiles-doc-ownership-review/SKILL.md"
unopposed_stake = "S8"
paths = ["AGENTS.md", "*/AGENTS.md", "*/README.md", "docs/**", ".agents/**"]
keywords = ["README", "AGENTS.md", "documentation", "owner", "review-graph"]

[[stance]]
id = "dotfiles-portability-stance"
title = "Dotfiles portability stance"
objective = "A tracked config renders correctly on every selected machine without a manual rescue."
skill = ".agents/skills/dotfiles-portability-stance/SKILL.md"
surfaces = ["live-state-review"]
stakes = ["S1"]

[[stance.accepted_harm]]
payer = "dotfiles-live-state-stance"
payer_stance = "dotfiles-live-state-stance"
cost = "a live value must be carried back into local.toml before it can render"
resource = "whether the repo or the live tool state is the source of truth for a rendered value"

[[stance]]
id = "dotfiles-live-state-stance"
title = "Dotfiles live-state stance"
objective = "A tool's live config survives deploy and is not silently overwritten."
skill = ".agents/skills/dotfiles-live-state-stance/SKILL.md"
surfaces = ["live-state-review"]
stakes = ["S2"]

[[stance.accepted_harm]]
payer = "dotfiles-portability-stance"
payer_stance = "dotfiles-portability-stance"
cost = "a fresh machine may render differently until local.toml is populated; deploy can block on a conflict"
resource = "whether the repo or the live tool state is the source of truth for a rendered value"

[[stance.accepted_harm]]
payer = "the user who switched a setting in the tool UI"
cost = "the switch is lost if reverse sync does not cover the key"
resource = "whether the repo or the live tool state is the source of truth for a rendered value"

[[stance]]
id = "dotfiles-explicit-composition-stance"
title = "Dotfiles explicit composition stance"
objective = "Package selection, coupling, and mappings stay explicit and readable."
