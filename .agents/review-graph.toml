surfaces = ["config-composition-review"]
stakes = ["S5"]

[[stance.accepted_harm]]
payer = "dotfiles-low-friction-stance"
payer_stance = "dotfiles-low-friction-stance"
cost = "every new coupling or mapping is a visible edit; a variable cannot pull in a package"
resource = "how many places a maintainer edits to add or change one deployed file"

[[stance]]
id = "dotfiles-low-friction-stance"
title = "Dotfiles low-friction stance"
objective = "One package selection deploys a whole environment with few decisions."
skill = ".agents/skills/dotfiles-low-friction-stance/SKILL.md"
surfaces = ["config-composition-review"]
stakes = ["S10"]

[[stance.accepted_harm]]
payer = "the reader debugging a deployed file"
payer_stance = "dotfiles-explicit-composition-stance"
cost = "cannot tell which base package supplied a file; a grouping package hides the source"
resource = "how many places a maintainer edits to add or change one deployed file"

[[stance]]
id = "dotfiles-enterprise-isolation-stance"
