[core]
xwayland=true
idle-time=0

[shell]
panel-position=none
background-color=0xff000000
locking=false
animation=none
startup-animation=none
close-animation=none
focus-animation=none

[xwayland]
# Abaqus/CAE 2022 needs indirect GLX for its print feedback context.
path={{env_var "HOME"}}/.local/bin/Xwayland+iglx
