dir={{env_var "HOME"}}/Downloads/aria2
continue=true
# falloc is the recommended method on btrfs/ext4/xfs
file-allocation=falloc
disk-cache=64M
log-level=warn

max-concurrent-downloads=5
optimize-concurrent-downloads=true
max-connection-per-server=16
split=16
min-split-size=4M
max-tries=0
retry-wait=5

# aria2 does not expand ~ or ${HOME} in these paths; the systemd unit creates the file
input-file={{env_var "HOME"}}/.local/state/aria2/session
save-session={{env_var "HOME"}}/.local/state/aria2/session
save-session-interval=60

enable-rpc=true
rpc-listen-all=false
rpc-allow-origin-all=true
# {{#if aria2.rpc_secret}}
rpc-secret={{aria2.rpc_secret}}
# {{/if}}
