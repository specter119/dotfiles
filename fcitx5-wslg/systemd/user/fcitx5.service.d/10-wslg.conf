[Service]
# DISPLAY comes from environment.d/wslg.conf; this only waits for Xwayland's socket,
# which can appear after the user manager and its units have already started.
# fcitx5 never retries X11 once it has started without it.
ExecStartPre=/bin/sh -c 'until [ -S /tmp/.X11-unix/X0 ]; do sleep 1; done'
# WSLg's compositor gives clients no input-method backend, and fcitx5 exits
# when its Wayland frontend loses that connection; serve X11 and D-Bus only.
ExecStart=
ExecStart=fcitx5 --replace --disable=wayland,waylandim
# fcitx5 exits cleanly when its main display (Xwayland) goes away.
Restart=always
RestartSec=2
